    <style>
        :root {
            /* 🧪 ЭКСПЕРИМЕНТ: ЗАЛИВАЕМ ЗАДНИЙ ФОН САЙТА КРИСТАЛЬНО БЕЛЫМ ЦВЕТОМ */
            --bg-color: #ffffff;         
            --text-color: #212529;       
            --border-color: #dee2e6;     
            --primary-color: #0d6efd;    
            --primary-hover: #0b5ed7;
            --panel-bg: #ffffff;         
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Разрешаем браузеру Safari нативно обрабатывать жест pull-to-refresh для обновления */
            overscroll-behavior-y: auto; 
        }
        
        /* 🌟 НАДЁЖНЫЙ ФИКС ШАПКИ НА IOS: используем sticky вместо fixed. Теперь Safari не сможет сдвинуть шапку под часы! */
        .fixed-header {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            background-color: var(--panel-bg);
            z-index: 1000;
            padding: 8px 16px 4px 16px;
            box-sizing: border-box;
            border-bottom: 1px solid transparent;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px 20px 20px;
            box-sizing: border-box;
        }

        /* 🌟 ЮВЕЛИРНЫЙ ПУСТОЙ БУФЕР: Расталкивает контент ровно на высоту шапки */
        /* За счет этого Европа и Субъекты России будут стоять на абсолютно одинаковой высоте пиксель в пиксель */
        .header-spacer {
            height: 165px; 
            width: 100%;
            display: block;
        }

        @media (max-width: 600px) {
            .fixed-header {
                padding: 6px 12px !important;
            }
            .container {
                padding: 0 4px 20px 4px !important;
            }
            .header-spacer {
                height: 112px; /* Идеальная мобильная высота spacer под строку поиска */
            }
        }
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: var(--panel-bg);
            box-shadow: none !important;      
            z-index: 1000;
            /* 🌟 ЮВЕЛИРНОЕ СЖАТИЕ: сверху 8px, по бокам 16px, снизу под поиском всего 4px! */
            padding: 8px 16px 4px 16px; 
        }
        .header-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            /* 🌟 Прижали инпут ближе к кнопкам меню для идеального баланса */
            gap: 4px; 
        }


        .nav-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
        }
        .tab-btn {
            padding: 8px 16px;
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 600;
            /* 🌟 ОБЫЧНОЕ СОСТОЯНИЕ: цвет букв в точности как варианты ответов */
            color: #495057 !important; 
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
        }
        .tab-btn.active {
            /* 🌟 НАЖАТОЕ СОСТОЯНИЕ: сверхжирный графит, копейка в копейку как вопросы в квизах */
            color: #495057 !important;          
            font-weight: 800 !important;
            background-color: #e9ecef !important; 
        }


        .controls-row {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            display: flex;
            gap: 5px;
            position: relative;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            padding-right: 35px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 15px;
        }
        .clear-search-btn {
            position: absolute;
            right: 85px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 18px;
            color: #6c757d;
            cursor: pointer;
            display: none;
            padding: 0;
            line-height: 1;
        }
        .clear-search-btn:hover {
            color: #212529;
        }
        button.action-btn {
            padding: 10px 18px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        button.action-btn:hover {
            background-color: var(--primary-hover);
        }
        button.btn-secondary {
            background-color: #6c757d;
        }
        button.btn-secondary:hover {
            background-color: #5c636a;
        }
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }
        .continent-block {
            background: #fff;
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
            border-left: none !important;
            border-right: none !important;
            border-top: 1px solid var(--border-color);
            /* 🌟 УБРАЛИ НИЖНЮЮ ЛИНЕЮ БЛОКА, ЧТОБЫ ИЗБАВИТЬСЯ ОТ ЗАДВОЕНИЯ ПОЛОС: */
            border-bottom: none !important; 
            box-shadow: none !important; 
        }

.continent-header {
    background-color: #f1f3f5;
    padding: 15px 20px;
    margin: 0;
    font-size: 18px;
    font-weight: 800 !important;
    color: #495057 !important; 
    cursor: pointer;
    /* 🌟 ВОЗВРАЩАЕМ ФЛЕКС: теперь кнопки растянутся на всю ширину экрана */
    display: flex !important;
    justify-content: flex-start;
    align-items: center;
    gap: 10px;
    user-select: none;
    box-sizing: border-box !important;
    width: 100% !important;
}

/* 🌟 УМНОЕ ПРАВИЛО: не даёт цифре 3 улетать в правый угол на смартфонах */
.continent-header span:first-child {
    flex-grow: 1; /* Разрешаем тексту занимать свободную площадь, мягко отодвигая цифру */
    text-align: left;
}
.continent-header .count-badge {
    flex-shrink: 0; /* Строгий запрет на сплющивание рамки на маленьких экранах */
}

.count-badge {
    /* 🌟 ПОЛНОСТЬЮ СТЕРЛИ СЕРЫЙ ФОН, СДЕЛАВ ЕГО КРИСТАЛЬНО ПРОЗРАЧНЫМ */
    background: transparent !important;
    /* 🌟 ГРАФИТОВАЯ КОНТУРНАЯ РАМКА: тонкая, аккуратная, в цвет шрифта */
    border: 1px solid #495057 !important;
    /* Тёмно-графитовые цифры для безупречной мягкой читаемости */
    color: #495057 !important;
    padding: 1px 9px; /* Микро-коррекция полей, чтобы рамка обнимала цифры идеально ровно */
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700 !important; 
}


        .continent-header:hover {
            background-color: #e9ecef;
        }

        .continent-content {
            padding: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            display: none;
        }
        .continent-block.collapsed .continent-content {
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 15px;

        }

            background-color: #f8f9fa;

        }

        .flag-wrapper {
            display: inline-flex;

            justify-content: center;
            height: 60px;
            width: 120px;
        }
        .flag-img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            border-radius: 2px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            border: 1px solid rgba(0,0,0,0.08);
            box-sizing: border-box;
        }
        
      .flag-img[src*="/CH.svg"], 
        .flag-img[src*="Austria"], 
        .flag-img[src*="Andorra"], 
        .flag-img[src*="Belarus"] {
            border: none !important;
            box-shadow: none !important;
        }
        /* ВЫНЕСЛИ НЕПАЛ В ОТДЕЛЬНОЕ НЕУБИВАЕМОЕ ПРАВИЛО: */
        .flag-img[src*="/NP.svg"], .flag-img[src*="np.svg"], .flag-img[alt*="Непал"] {
            mix-blend-mode: multiply !important;
            border: none !important;
            box-shadow: none !important;
            background: transparent !important;
        }

        
        tr.hidden { display: none; }
        .count-badge {
            background: #6c757d;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
        }
        .quiz-panel {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            padding: 30px;
            text-align: center;
            max-width: 600px;
            margin: 20px auto;
        }
        .quiz-question {
            font-size: 22px;
            /* 🌟 ГРАФИТОВЫЙ ЦВЕТ И СВЕРХЖИРНОСТЬ НА ПК: */
            font-weight: 800 !important;
            color: #495057 !important; 
            margin-bottom: 25px;
        }

         .quiz-flag-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 120px;
            width: auto;                  /* Разрешаем контейнеру сжиматься по ширине флага */
            margin-bottom: 25px;
            background: transparent !important; /* Убираем фоновый прямоугольник сзади флага */
        }
        .quiz-flag-img {
            height: 120px;                /* Жестко фиксируем высоту на ПК для одинакового масштаба */
            width: auto;                  /* Ширина пропорционально растянется сама по форме флага */
            object-fit: contain;
            border-radius: 4px;
            /* Рамка и тень теперь обнимают СТРОГО саму ткань флага, а не пустой воздух! */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.1);
            box-sizing: border-box;
            background-color: #ffffff;    /* Защитный слой для белых элементов флагов */
        }


        
        /* Защита Швейцарии от рамок (Ватикан отсюда убрали, чтобы вернуть ему контур) */
        .quiz-flag-img[src*="/CH.svg"] {
            border: none !important;
            box-shadow: none !important;
        }

        /* Персональная очистка Непала для квизов на ПК */
        .quiz-flag-img[src*="/NP.svg"], .quiz-flag-img[src*="np.svg"] {
            border: none !important;
            box-shadow: none !important;
        }



        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        @media (max-width: 500px) {
            .quiz-options { grid-template-columns: 1fr; }
        }
        .option-btn {
            padding: 14px 20px;
            background-color: #f8f9fa;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .option-btn:hover:not([disabled]) {
            background-color: #e9ecef;
            border-color: #adb5bd;
        }
        .option-btn.correct {
            background-color: #d1e7dd !important;
            border-color: #a3cfbb !important;
            color: #0f5132 !important;
            font-weight: bold;
        }
        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: #f1aeb5 !important;
            color: #842029 !important;
        }
        .quiz-stats {
            margin-top: 20px;
            font-size: 15px;
            color: #6c757d;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .scroll-top-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 40px;
            height: 40px;
            background: none !important;      /* Намертво стираем черный круглый фон */
            /* 🌟 ТОНКАЯ СЕРАЯ СТРЕЛКА: благородный цвет с легкой прозрачностью */
            color: rgba(0, 0, 0, 0.3) !important; 
            border: none !important;
            cursor: pointer;
            font-size: 24px !important;       /* Сделали саму стрелочку чуть крупнее и аккуратнее */
            font-weight: 300 !important;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: none !important;      /* Полностью убрали громоздкую тень */
            transition: color 0.2s;
            z-index: 999;
            -webkit-tap-highlight-color: transparent; /* Убираем серый квадрат при тапе на Айфоне */
        }
        .scroll-top-btn:hover {
            color: rgba(0, 0, 0, 0.6) !important; /* При наведении становится чуть отчетливее */
        }

function createContinentBlock(continent, countries) {
    const block = document.createElement('div');

    block.className = 'continent-block collapsed';
    block.id = `block-${continent.replace(/\s+/g, '-')}`;
    
    let rowsHtml = '';
    
    countries.forEach(c => {
        let flagSrc = getFlagUrl(c);
        const subText = c.note ? ` <span style="font-size:12px; color:#6c757d; font-weight:normal;">${c.note}</span>` : '';
        rowsHtml += `
            <tr data-name="${c.name.toLowerCase()}" data-capital="${c.capital.toLowerCase()}">
                <td class="col-flag">
                   <div class="flag-wrapper">
                       <img class="flag-img" src="${flagSrc}" alt="${c.name}" loading="lazy" onclick="openFlagModal(this.src)">
                   </div>
                </td>
                <td>
                    <a href="https://google.com/maps/search/?api=1&query=${encodeURIComponent(c.name)}" 
                       target="_blank" 
                       style="color: inherit; text-decoration: none; cursor: pointer;">
                        <strong>${c.name}</strong>
                    </a>
                    ${subText}
                </td>
                <td>
                    <a href="https://google.com/maps/search/?api=1&query=${encodeURIComponent(c.capital)}" 
                       target="_blank" 
                       style="color: inherit; text-decoration: none; cursor: pointer;">
                        ${c.capital}
                    </a> 
                </td>
            </tr>`;
    }); // 🌟 Убрали из цикла строки globalCounter++ и localCounter++

    block.innerHTML = `
        <h2 class="continent-header" onclick="toggleBlock('${block.id}')">
            <span>${continent}</span>
            <span class="count-badge" id="badge-${block.id}">${countries.length}</span>
        </h2>
        <div class="continent-content">
            <table>
                <thead>
                    <tr>
                        <!-- 🌟 Полностью удалили скрытый заголовок th class="col-num" -->
                        <th class="col-flag">Флаг</th>
                        <th>Страна</th>
                        <th>Столица</th>
                    </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
            </table>
        </div>
    `;
    tablesContainer.appendChild(block);
}

function runSearch() {
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearSearchBtn');
    const q = searchInput.value.toLowerCase().trim();
    
    if (searchInput.value.length > 0) {
        clearBtn.style.display = 'block';
    } else {
        clearBtn.style.display = 'none';
    }

    const isRussiaDbActive = document.querySelector('.tab-btn:nth-child(2)').classList.contains('active');

    document.querySelectorAll('.continent-block').forEach(block => {
        const isRussiaBlock = block.id.startsWith('block-ru-');
        
        // Разделение вкладок: на вкладке России скрываем мир, на вкладке мира скрываем Россию
        if (isRussiaDbActive && !isRussiaBlock) {
            block.style.display = 'none';
            return;
        }
        if (!isRussiaDbActive && isRussiaBlock) {
            block.style.display = 'none';
            return;
        }

        // Логика отображения главных кнопок меню России (Субъекты и Округа)
        if (block.id === 'block-ru-sub-header' || block.id === 'block-ru-okr-header') {
            if (isRussiaDbActive && q === '') {
                block.style.display = 'block'; 
            } else {
                block.style.display = 'none';  
            }
            return;
        }

        // Изоляция поиска внутри выбранного подраздела на вкладке России
        if (isRussiaDbActive && q !== '') {
            const isInSubjectsContainer = block.closest('#ruSubjectsContainer') !== null;
            const isInOkrugsContainer = block.closest('#ruOkrugsContainer') !== null;

            if (currentRuZone === 'subjects' && !isInSubjectsContainer) {
                block.style.display = 'none';
                return;
            }
            if (currentRuZone === 'okrugs' && !isInOkrugsContainer) {
                block.style.display = 'none';
                return;
            }
        }

        const rows = block.querySelectorAll('tbody tr');
        const content = block.querySelector('.continent-content'); 
        
        if (rows.length === 0) return;

        let visibleCount = 0;
        
        rows.forEach(r => {
            const name = r.getAttribute('data-name') || '';
            const cap = r.getAttribute('data-capital') || '';
            
            if (name.includes(q) || cap.includes(q)) {
                r.classList.remove('hidden');
                visibleCount++;
            } else {
                r.classList.add('hidden');
            }
        });
        
        const badge = document.getElementById(`badge-${block.id}`);
        if (badge) badge.textContent = visibleCount;
        
        if (visibleCount === 0 && q !== '') {
            block.style.display = 'none';
        } else {
            if (q !== '') {
                // АКТИВНЫЙ ПОИСК (ДЛЯ ОБЕИХ ВКЛАДОК)
                block.style.display = 'block';
                block.classList.remove('collapsed');
                if (content) content.style.display = 'block';
                
                if (isRussiaDbActive) {
                    if (currentRuZone === 'subjects') {

                block.classList.add('collapsed'); // Железно сворачиваем плашку

                if (isRussiaDbActive) {
                    if (currentRuZone === 'subjects') {
                        document.getElementById('ruMainMenuZone').style.display = 'none';
                        document.getElementById('ruSubmissionsZone').style.display = 'block';
                        document.getElementById('ruOkrugsZone').style.display = 'none';

                        document.getElementById('ruMainMenuZone').style.display = 'none';
                        document.getElementById('ruSubmissionsZone').style.display = 'none';
                        document.getElementById('ruOkrugsZone').style.display = 'block';
                        document.getElementById('ruOkrugsContainer').style.display = 'block';
                        if (!block.closest('#ruOkrugsContainer')) block.style.display = 'none';
                    } else {
                        // Если сбросили поиск на главной — возвращаем 3 кнопки первого уровня меню
                        document.getElementById('ruMainMenuZone').style.display = 'block';
                        document.getElementById('ruSubmissionsZone').style.display = 'none';
                        document.getElementById('ruOkrugsZone').style.display = 'none';
                        
                        if (block.id !== 'block-ru-capital-alphabet') block.style.display = 'none';
                        document.getElementById('ruCapitalsContainer').style.display = 'block';
                    }
                } else {
                    // СБРОС СТРАН МИРА: сбрасываем счетчик стран в плашке до исходного и переводим флаг в true
                    allCollapsed = true;
                    // Восстанавливаем корректную цифру общего количества стран в названии каждого континента
                    const initialCount = block.querySelectorAll('tbody tr').length;
                    if (badge) badge.textContent = initialCount;
                }
            }
        }
    });
}

    if (flagRound === 1) {

    if (currentFlagTarget.iso.toLowerCase() === 'np') {

    } else {
        flagContainerEl.style.backgroundColor = '#ffffff';

        /* СБРАСЫВАЕМ СТИЛИ В ДЕФОЛТ ДЛЯ ОСТАЛЬНЫХ СТРАН МИРА (ЯПОНИЯ, ВАТИКАН): */
        flagImgEl.style.border = '';
        flagImgEl.style.borderWidth = '';
        flagImgEl.style.boxShadow = '';
    }
    
    flagImgEl.src = highResUrl;




    
    let choices = [currentFlagTarget];
    while(choices.length < 4) {

function checkFlagAnswer(selectedBtn, chosenName) {
    document.querySelectorAll('#quizFlagOptions .option-btn').forEach(b => b.disabled = true);
    
    let isCorrect = (chosenName === currentFlagTarget.name);
    
    if (isCorrect) {
        selectedBtn.classList.add('correct');
        flagScore++;
        // ЛИШНЕЕ УДВОЕНИЕ flagRound++ ОТСЮДА УБРАНО!
    } else {
        selectedBtn.classList.add('wrong');
        document.querySelectorAll('#quizFlagOptions .option-btn').forEach(b => {
            if(b.innerHTML.startsWith(currentFlagTarget.name)) b.classList.add('correct');
        });
    }
    
    // Проверяем и обновляем High Score в памяти телефона на лету
    let bestFlag = localStorage.getItem('highScore_flags') || 0;
    if (flagScore > parseInt(bestFlag)) {
        localStorage.setItem('highScore_flags', flagScore);
        bestFlag = flagScore;
    }
    
    // Выводим статистику: Очки и Раунд остаются ТЕКУЩИМИ (не обнуляются раньше времени!)
    document.getElementById('quizFlagStats').innerHTML = `🏆 Рекорд: ${bestFlag} &nbsp;|&nbsp; 🎯 Очки: ${flagScore} &nbsp;|&nbsp; 📋 Раунд: ${flagRound}`;

    // Переименовываем кнопку и взводим триггер сброса на единицу для следующего раунда
    const nextBtn = document.getElementById('nextFlagBtn');
    if (!isCorrect) {
        nextBtn.textContent = 'Начать заново';
        flagRound = 1; // В памяти ставим 1. При клике на кнопку сработает сброс очков
    } else {
        nextBtn.textContent = 'Следующий флаг';
        flagRound++; // При успехе раунд мягко увеличивается строго на +1
    }
    
    nextBtn.style.display = 'inline-block';
}

let lastScrollPosition = 0;

function openFlagModal(imgSrc) {
    const modal = document.getElementById('flagModal');
    const modalImg = document.getElementById('flagModalImg');
    modalImg.src = imgSrc;
    
    // 🌟 Намертво возвращаем окну его родной глубокий темный цвет
    modal.style.setProperty('background-color', '#1a1a1a', 'important');
    
    /* 🌟 ТОЧЕЧНОЕ РАСТВОРЕНИЕ БЕЛЫХ ПОЛЕЙ НЕПАЛА */
    if (imgSrc.includes('NP.svg') || imgSrc.includes('np.svg')) {
        modalImg.style.setProperty('mix-blend-mode', 'multiply', 'important');
        modalImg.style.setProperty('opacity', '1', 'important');
    } else {
        // 🌟 ИСПРАВЛЕНО ДЛЯ МИРОВЫХ ФЛАГОВ: сбрасываем смешивание и принудительно включаем видимость
        modalImg.style.setProperty('mix-blend-mode', 'unset', 'important');
        modalImg.style.setProperty('display', 'block', 'important');
        modalImg.style.setProperty('opacity', '1', 'important');
    }
    
    // Убираем рамки и тени, чтобы картинка была чистой
    modalImg.style.setProperty('border', 'none', 'important');
    modalImg.style.setProperty('box-shadow', 'none', 'important');
    modalImg.style.setProperty('clip-path', 'none', 'important');
    
    document.body.style.overflow = 'hidden';
    
    modal.style.display = 'flex';
    setTimeout(() => {
        modal.classList.add('open');
        /* 🌟 ПРАВИЛЬНОЕ СКРЫТИЕ: Мягко гасим прозрачность сайта, чтобы он не просвечивал под панелью Safari */
        const header = document.querySelector('.fixed-header');
        const container = document.querySelector('.container');
        if (header) header.classList.add('site-fade');
        if (container) container.classList.add('site-fade');
    }, 10);
}

function closeFlagModal() {

    /* 🌟 МОЛНИЕНОСНЫЙ КЛИК: Мгновенно убираем класс открытия флага */

function toggleBlock(id) {
    const block = document.getElementById(id);
    if (!block) return;
    
    block.classList.toggle('collapsed');
    const content = block.querySelector('.continent-content');
    
    if (content) {
        if (block.classList.contains('collapsed')) {
            content.style.display = 'none';
            
            setTimeout(() => {
                const offset = window.innerWidth <= 600 ? 115 : 170;
                const isRussia = id.startsWith('block-ru-');
                
                if (isRussia) {
                    const republicsBlock = document.getElementById('block-ru-subject-Республики');
                    if (republicsBlock && id !== 'block-ru-subject-Республики') {
                        const offsetPosition = republicsBlock.offsetTop - offset;
                        window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                        return;
                    }
                } else {
                    const europeBlock = document.getElementById('block-Европа');
                    if (europeBlock && id !== 'block-Европа') {
                        const offsetPosition = europeBlock.offsetTop - offset;
                        window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                        return;
                    }
                }
                
                const offsetPosition = block.offsetTop - offset;
                window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
            }, 10);
            return;
        } else {
            content.style.display = 'block';
        }

        setTimeout(() => {
            const offset = window.innerWidth <= 600 ? 115 : 170;
            const offsetPosition = block.offsetTop - offset;
            const diff = Math.abs(window.scrollY - offsetPosition);

            if (diff > 2) {
                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });
            }
        }, 60); 
    }
}

function generateRussiaOkrugsTables() {
    const container = document.getElementById('ruOkrugsContainer');
    if (!container) return;

    for (const [okrugName, regions] of Object.entries(russiaOkrugsData)) {
        const block = document.createElement('div');
        block.className = 'continent-block collapsed';
        
        const safeId = `block-ru-okrug-${okrugName.replace(/\s+/g, '-')}`;
        block.id = safeId;
        
        let rowsHtml = '';
        regions.forEach(r => {
            // Ищем флаг региона в базе subjectFlags по его имени (r.name)
            let flagUrl = subjectFlags[r.name] || "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='100' height='42'><rect width='100%' height='100%' fill='none'/></svg>";

            rowsHtml += `
                <tr data-name="${r.name.toLowerCase()}" data-capital="${r.capital.toLowerCase()}">
                    <td class="col-flag">
                       <div class="flag-wrapper">
                           <img class="flag-img" src="${flagUrl}" alt="Флаг ${r.name}" loading="lazy" onclick="openFlagModal(this.src)">
                       </div>
                    </td>
                    <td>
                  <a href="https://google.com/maps/search/?api=1&query=${encodeURIComponent(r.name)}" 
                           target="_blank" style="color: inherit; text-decoration: none; cursor: pointer;">
                            <strong>${r.name}</strong>
                        </a>
                    </td>
                    <td>
               <a href="https://google.com/maps/search/?api=1&query=${encodeURIComponent(r.capital)}" 
                           target="_blank" style="color: inherit; text-decoration: none; cursor: pointer;">
                            ${r.capital}
                        </a>
                    </td>
                </tr>`;
        });

        block.innerHTML = `
            <h2 class="continent-header" onclick="toggleBlock('${block.id}')">
                <span>${okrugName}</span>
                <span class="count-badge" id="badge-${block.id}">${regions.length}</span>
            </h2>
            <div class="continent-content">
                <table>
                    <thead>
                        <tr>
                            <th class="col-flag">Флаг</th>
                            <th>Регион</th>
                            <th>Адм. центр</th>
                        </tr>
                    </thead>
                    <tbody>${rowsHtml}</tbody>
                </table>
            </div>
        `;
        container.appendChild(block);
    }
}

// 🌟 ОЖИВЛЯЕМ ВСЮ БАЗУ РОССИИ: запускаем сборку таблиц строго после того,
// как браузер полностью прочитал всю страницу и создал HTML-контейнеры.
window.addEventListener('DOMContentLoaded', () => {
    generateRussiaSubjectsTables();
    generateRussiaOkrugsTables();
    generateRussiaCapitalsTable();
});

</script>
