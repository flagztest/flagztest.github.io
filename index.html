<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страны, столицы и флаги мира</title>
    <style>
        :root {
            /* 🧪 ЭКСПЕРИМЕНТ: ЗАЛИВАЕМ ЗАДНИЙ ФОН САЙТА КРИСТАЛЬНО БЕЛЫМ ЦВЕТОМ */
            --bg-color: #ffffff;         
            --text-color: #212529;       
            --border-color: #dee2e6;     
            --primary-color: #0d6efd;    
            --primary-hover: #0b5ed7;
            --panel-bg: #ffffff;         
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-top: 165px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: var(--panel-bg);
            box-shadow: none !important;      
            z-index: 1000;
            /* 🌟 ЮВЕЛИРНОЕ СЖАТИЕ: сверху 8px, по бокам 16px, снизу под поиском всего 4px! */
            padding: 8px 16px 4px 16px; 
        }
        .header-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            /* 🌟 Прижали инпут ближе к кнопкам меню для идеального баланса */
            gap: 4px; 
        }


        .nav-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
        }
        .tab-btn {
            padding: 8px 16px;
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 600;
            color: #6c757d;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
        }
         .tab-btn.active {
            color: inherit !important;          /* Текст и эмодзи сохраняют свой оригинальный цвет */
            background-color: #e9ecef !important; /* Новый благородный плоский светло-серый фон подсветки */
}

        .controls-row {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            display: flex;
            gap: 5px;
            position: relative;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            padding-right: 35px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 15px;
        }
        .clear-search-btn {
            position: absolute;
            right: 85px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 18px;
            color: #6c757d;
            cursor: pointer;
            display: none;
            padding: 0;
            line-height: 1;
        }
        .clear-search-btn:hover {
            color: #212529;
        }
        button.action-btn {
            padding: 10px 18px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        button.action-btn:hover {
            background-color: var(--primary-hover);
        }
        button.btn-secondary {
            background-color: #6c757d;
        }
        button.btn-secondary:hover {
            background-color: #5c636a;
        }
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }
        .continent-block {
            background: #fff;
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
            border-left: none !important;
            border-right: none !important;
            border-top: 1px solid var(--border-color);
            /* 🌟 УБРАЛИ НИЖНЮЮ ЛИНЕЮ БЛОКА, ЧТОБЫ ИЗБАВИТЬСЯ ОТ ЗАДВОЕНИЯ ПОЛОС: */
            border-bottom: none !important; 
            box-shadow: none !important; 
        }

        .continent-header {
            background-color: #f1f3f5;
            padding: 15px 20px;
            margin: 0;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            user-select: none;
        }
        .continent-header:hover {
            background-color: #e9ecef;
        }
        /* 1. По умолчанию для ОТКРЫТОГО блока стрелка смотрит вниз */
.continent-header::after {
    content: '▼';
    font-size: 12px;
    transition: transform 0.2s;
    margin-left: auto;
    transform: rotate(0deg); /* Стрелка вниз */
}

/* 2. Когда блок СВЕРНУТ (collapsed), принудительно разворачиваем стрелку ВПРАВО */
.continent-block.collapsed .continent-header::after {
    transform: rotate(-90deg) !important; /* Поворот влево на 90 градусов превратит ▼ в ▶ */
}
        .continent-content {
            padding: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            display: none;
        }
        .continent-block.collapsed .continent-content {
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        .col-num { display: none !important; }
        .col-flag { width: 150px; text-align: center; }
        
        .flag-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 60px;
            width: 120px;
        }
        .flag-img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            border-radius: 2px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            border: 1px solid rgba(0,0,0,0.08);
            box-sizing: border-box;
        }
        
      .flag-img[src*="/CH.svg"], 
        .flag-img[src*="Austria"], 
        .flag-img[src*="Andorra"], 
        .flag-img[src*="Belarus"] {
            border: none !important;
            box-shadow: none !important;
        }
        /* ВЫНЕСЛИ НЕПАЛ В ОТДЕЛЬНОЕ НЕУБИВАЕМОЕ ПРАВИЛО: */
        .flag-img[src*="/NP.svg"], .flag-img[src*="np.svg"], .flag-img[alt*="Непал"] {
            mix-blend-mode: multiply !important;
            border: none !important;
            box-shadow: none !important;
            background: transparent !important;
        }

        
        tr.hidden { display: none; }
        .count-badge {
            background: #6c757d;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
        }
        .quiz-panel {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            padding: 30px;
            text-align: center;
            max-width: 600px;
            margin: 20px auto;
        }
        .quiz-question {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
        }
         .quiz-flag-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 120px;
            width: auto;                  /* Разрешаем контейнеру сжиматься по ширине флага */
            margin-bottom: 25px;
            background: transparent !important; /* Убираем фоновый прямоугольник сзади флага */
        }
        .quiz-flag-img {
            height: 120px;                /* Жестко фиксируем высоту на ПК для одинакового масштаба */
            width: auto;                  /* Ширина пропорционально растянется сама по форме флага */
            object-fit: contain;
            border-radius: 4px;
            /* Рамка и тень теперь обнимают СТРОГО саму ткань флага, а не пустой воздух! */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.1);
            box-sizing: border-box;
            background-color: #ffffff;    /* Защитный слой для белых элементов флагов */
        }


        
        /* Защита Швейцарии от рамок (Ватикан отсюда убрали, чтобы вернуть ему контур) */
        .quiz-flag-img[src*="/CH.svg"] {
            border: none !important;
            box-shadow: none !important;
        }

        /* Персональная очистка Непала для квизов на ПК */
        .quiz-flag-img[src*="/NP.svg"], .quiz-flag-img[src*="np.svg"] {
            border: none !important;
            box-shadow: none !important;
        }



        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        @media (max-width: 500px) {
            .quiz-options { grid-template-columns: 1fr; }
        }
        .option-btn {
            padding: 14px 20px;
            background-color: #f8f9fa;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .option-btn:hover:not([disabled]) {
            background-color: #e9ecef;
            border-color: #adb5bd;
        }
        .option-btn.correct {
            background-color: #d1e7dd !important;
            border-color: #a3cfbb !important;
            color: #0f5132 !important;
            font-weight: bold;
        }
        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: #f1aeb5 !important;
            color: #842029 !important;
        }
        .quiz-stats {
            margin-top: 20px;
            font-size: 15px;
            color: #6c757d;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .scroll-top-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #212529;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: opacity 0.2s;
            z-index: 999;
        }
        .scroll-top-btn:hover {
            background-color: #000000;
        }
@media (max-width: 600px) {
     /* 🌟 СЕТКА ШАПКИ: Растягиваем каркас кнопок пиксель в пиксель по ширине поиска */
     .nav-tabs {
         border-bottom: none !important; 
         padding-bottom: 0px !important;
         display: grid !important;
         grid-template-columns: repeat(4, 1fr) !important; /* Делим меню на 4 абсолютно равные доли */
         width: 100% !important; /* Растягиваем ровно по ширине поисковой строки */
         gap: 4px !important;    /* Компактные аккуратные зазоры между синими кнопками */
         box-sizing: border-box !important;
     }
     
     /* КНОПКИ: Сохраняют сочный крупный шрифт, стоят в одну строку и не вылезают за экран */
     .tab-btn {
         width: 100% !important;
         padding: 6px 0px !important; /* Намертво зануляем боковые поля, убирая раздувание Safari! */
         font-size: 15px !important;  /* ВАШ КРУПНЫЙ ШРИФТ ОСТАЁТСЯ НЕИЗМЕННЫМ */
         font-weight: 600 !important;
         text-align: center !important;
         white-space: nowrap !important; /* СТРОГИЙ ЗАПРЕТ НА ПЕРЕНОС СЛОВ */
         overflow: visible !important;
         box-sizing: border-box !important;
     }

     .clear-search-btn {
         right: 15px !important;
     } 
     
     /* Выравниваем боковые края шапки, чтобы инпут и кнопки совпадали до доли миллиметра */
     .fixed-header {
         padding: 6px 12px !important; 
         box-sizing: border-box !important;
     }

     .header-content {
         gap: 2px !important; /* Прижали поиск к вкладкам */
     }
     body {
         padding: 10px 4px !important;
         /* 🌟 ПРИЖИМАЕМ ЕВРОПУ К ШАПКЕ ПРИ СТАРТЕ САЙТА: */
         padding-top: 120px !important; 
     }

     .controls-row {
          gap: 8px !important;
     }
     input[type="text"] {
          padding: 6px 10px !important; 
          font-size: 16px !important; /* ЖЕЛЕЗНЫЙ БЛОК АВТОЗУМА: Safari больше не сдвинет экран! */
     }

            .flag-wrapper {
           height: 44px !important;
           width: auto !important;
           display: inline-flex !important;
           align-items: center !important;
           justify-content: center !important; /* Центрирует флаг внутри его ячейки */
     }

     .flag-img {
           height: 100% !important;
           width: auto !important;
           object-fit: contain !important;
     }


     .continent-content {
           /* 🌟 ЛИНИИ И ШАПКА СПАСЕНЫ: убрали отступы контента, вернув линии от края до края */
           padding: 0px 0px 8px 0px !important; 
           background-color: #ffffff !important;
     }

     .continent-content {
           /* Возвращаем чистые нулевые поля контента, чтобы линии шли строго от края до края экрана дисплея */
           padding: 0px 0px 8px 0px !important; 
           background-color: #ffffff !important;
     }

     /* 1. Возвращаем монолитную жесткую сетку таблиц во весь экран */
     table {
           width: 100% !important; 
           table-layout: fixed !important; 
           border-collapse: collapse !important;
           border: none !important; 
           /* 🌟 ЗАЗОР ДЛЯ КАТАРА: мягко отодвинули ряды на 12px вправо, проявив его левую рамку */
           padding-left: 12px !important;
           box-sizing: border-box !important;
     }

     th {
           text-align: left !important;
           border-bottom: 2px solid var(--border-color) !important;
     }

     /* 2. Задаем строгие мобильные доли колонок и выравнивание заголовков */
     .col-flag {
            /* 🌟 ВЕРНУЛИ ПРЕЖНИЙ КРУПНЫЙ РАЗМЕР: ячейка снова широкая и просторная */
            width: 85px !important;        
            padding: 10px 0px !important;   
            box-sizing: border-box !important;
     }

     th.col-flag {
            text-align: center !important;
     }
     
     td:nth-child(2) {
            /* 🌟 СПАСАЕМ ВЕЛИКОБРИТАНИЮ: даём текстовому полю 48%, буква "я" встанет ровно в строку */
            width: 48% !important;         
            padding-left: 15px !important; /* Красивый отпуск ткани флага от букв страны */
            padding-right: 5px !important;
     }

     th:nth-child(3) {
            text-align: left !important;
            padding-left: 15px !important; 
     }

     td:nth-child(3) {
            width: 32% !important;         
            padding-left: 5px !important;
     }

     th, td {
            padding: 10px 2px !important;
            vertical-align: middle !important;
            white-space: normal !important;
            word-wrap: break-word !important;
            overflow-wrap: break-word !important;
            
            border-left: none !important;   
            border-right: none !important;  
            border-top: none !important;    
            border-bottom: 1px solid var(--border-color) !important; 
     }

     table tbody tr:last-child td {
            border-bottom: none !important;
     }
     
     .col-num, th.col-num {
            display: none !important;
     }
     td {
            text-align: left !important;
            font-size: 14px !important;
     }

     /* 3. НАСТРОЙКА ФЛАГОВ ПО УМОЛЧАНИЮ: Сочный крупный вид без белых полос */
     .flag-wrapper {
           width: 85px !important;         
           height: 44px !important; /* Вернули крупную высоту флагов */
           display: inline-flex !important;
           align-items: center !important;
           justify-content: center !important; 
           overflow: visible !important;
     }

     .flag-img {
           height: 100% !important;        
           width: auto !important;         
           /* 🌟 СТИРАЕМ БЕЛИЗНУ НАМЕРТВО: contain возвращает флагам их чистые природные пропорции */
           object-fit: contain !important; 
           border-radius: 2px !important;
           box-shadow: 0 1px 4px rgba(0,0,0,0.15) !important;
           border: 1px solid rgba(0,0,0,0.08) !important;
           box-sizing: border-box !important;
     }

     /* 🌟 НАШ ПЕРСОНАЛЬНЫЙ ХАК ДЛЯ КАТАРА: */
     .flag-img[src*="QA.svg"], .flag-img[src*="qa.svg"], .flag-img[alt*="Катар"] {
           max-width: none !important;     
           width: 105px !important; /* Вытягиваем его во всю законную супер-длину */
           height: 44px !important;
           /* 🌟 УБРАЛИ FILL: ставим contain, чтобы стереть белые полосы сверху и снизу ткани флага */
           object-fit: contain !important; 
     }


     /* КВИЗЫ: Положение на мобильном */
     .view-section:not(#dbView) {
         padding-top: 0px !important;
         margin-top: -40px !important; 
     }
     .quiz-panel {
         padding: 10px !important;
         margin: 0px auto !important;
         /* 🌟 НАМЕРТВО УБИРАЕМ ОБВОДКУ И ТЕНЬ ВОКРУГ БЛОКА КВИЗА: */
         border: none !important;
         box-shadow: none !important;
     }


           /* 🌟 ИЗОЛИРОВАННЫЙ МОБИЛЬНЫЙ ЩИТ ДЛЯ НЕПАЛА (В базе и в квизе): */
     tr[data-name*="непал"] .flag-wrapper, 
     tr[data-name*="непал"] .flag-img,
     .quiz-flag-img[alt*="Непал"], .quiz-flag-img[src*="NP.svg"], .quiz-flag-img[src*="np.svg"] {
           mix-blend-mode: multiply !important; 
           border: none !important;
           border-width: 0px !important;
           border-style: none !important;
           box-shadow: none !important;
     }

     /* КВИЗЫ: Положение на мобильном */
     .view-section:not(#dbView) {
         padding-top: 0px !important;
         margin-top: -40px !important; 
     }
     .quiz-panel {
         padding: 10px !important;
         margin: 0px auto !important;
     }

     .quiz-flag-container {
         height: 100px !important;       
         width: auto !important;          
         margin-bottom: 20px !important; 
         margin-top: 5px !important;
         background: transparent !important;
     }
     .quiz-flag-img {
         height: 100px !important;        
         width: auto !important;          
     }

     .option-btn {
         padding: 10px 15px !important;
         font-size: 15px !important;
         background-color: #f8f9fa !important; 
         border: 2px solid #dee2e6 !important; 
         color: #495057 !important;            /* 🌟 БУКВЫ СТАЛИ ЧУТОЧКУ ТЕМНЕЕ И НА СТУПЕНЬ КОНТРАСТНЕЕ */
     }


/* 🌟 ГРАФИТОВЫЙ МОБИЛЬНЫЙ ЩИТ С ЗАЩИТОЙ ТЕМНЫХ ПОЛОС */
.flag-modal {
    position: fixed;
    top: -5px !important;    
    left: -5px !important;
    right: -5px !important;
    bottom: -5px !important;
    background-color: #1a1a1a !important; /* Насыщенный темно-серый цвет разделяет темные полосы флагов */
    display: none; 
    align-items: center;
    justify-content: center;
    z-index: 9999 !important; 
    opacity: 0;
    transition: opacity 0.2s ease-in-out;
    cursor: pointer;
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
}
.flag-modal.open {
    display: flex !important;
    opacity: 1 !important;
}
/* 🌟 МОБИЛЬНАЯ КАРТИНКА: ТОТАЛЬНОЕ ОБНУЛЕНИЕ ВСЕХ КОНТУРОВ И ТЕНЕЙ SAFARI */
.flag-modal-img {
    max-width: 95% !important;
    max-height: 75% !important;
    object-fit: contain !important;
    outline: none !important;
    transform: scale(0.95);
    transition: transform 0.2s ease-in-out;
    background-color: transparent !important;
    
    /* НАМЕРТВО СТИРАЕМ ЛЮБЫЕ ГРАНИЦЫ, РАМКИ, ТЕНИ И СВЕЧЕНИЯ: */
    border: none !important;
    border-width: 0px !important;
    border-style: none !important;
    box-shadow: none !important;
}

.flag-modal.open .flag-modal-img {
    transform: scale(1) !important;
}

     /* ВСТАВЛЯЕМ СЮДА: Делаем шрифт рекордов компактным на экранах Айфонов */
     .quiz-stats {
         font-size: 14px !important;
         font-weight: 600 !important;
         color: #495057 !important;
         letter-spacing: 0.3px !important;
     }
     /* 🌟 ЛИЧНЫЙ ЩИТ КАТАРА: Возвращает круговую рамку и проявляет левый контур */
     .flag-img[src*="QA.svg"], .flag-img[src*="qa.svg"], .flag-img[alt*="Катар"] {
           border: 1px solid rgba(0, 0, 0, 0.08) !important;
           margin-left: 1px !important;
     }

} /* 🌟 ГЛАВНАЯ СКОБКА: Намертво и правильно закрывает весь мобильный режим @media */


    
     
    </style>
</head>
<body>

<div class="fixed-header">

function getFlagUrl(country) {
    /* Насильно приводим iso к нижнему регистру при поиске в specialFlags */
    if (country.special && specialFlags[country.iso.toLowerCase()]) {
        return specialFlags[country.iso.toLowerCase()];
    }
    /* Запасной ресурс удален, теперь на экране будут только оригиналы из Википедии */
}

let globalCounter = 1;
const tablesContainer = document.getElementById('tablesContainer');

// Сначала создаем блок Европы, чтобы он железно находился на первом месте сверху
if (countriesData["Европа"]) {
    createContinentBlock("Европа", countriesData["Европа"]);
}
for (const [continent, countries] of Object.entries(countriesData)) {
    if (continent !== "Европа") {
        createContinentBlock(continent, countries);
    }
}
function createContinentBlock(continent, countries) {
    const block = document.createElement('div');

    block.className = 'continent-block collapsed';
    block.id = `block-${continent.replace(/\s+/g, '-')}`;
    
    let rowsHtml = '';
    let localCounter = 1;
    
   countries.forEach(c => {
    let flagSrc = getFlagUrl(c);
    const subText = c.note ? ` <span style="font-size:12px; color:#6c757d; font-weight:normal;">${c.note}</span>` : '';
    rowsHtml += `
            <tr data-name="${c.name.toLowerCase()}" data-capital="${c.capital.toLowerCase()}">
                <td class="col-flag">
                   <div class="flag-wrapper">
                       <img class="flag-img" src="${flagSrc}" alt="${c.name}" loading="lazy" onclick="openFlagModal(this.src)">
                   </div>
                </td>
                <td>
              <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.name)}" 
                       target="_blank" 
                       style="color: inherit; text-decoration: none; cursor: pointer;">
                        <strong>${c.name}</strong>
                    </a>
                    ${subText}
                </td>
                <td>
           <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.capital)}" 
                       target="_blank" 
                       style="color: inherit; text-decoration: none; cursor: pointer;">
                    ${c.capital}
                 </a> 
                </td>
            </tr>`;
        globalCounter++;
        localCounter++;
    });

    
    block.innerHTML = `
        <h2 class="continent-header" onclick="toggleBlock('${block.id}')">
            <span>${continent}</span>
            <span class="count-badge" id="badge-${block.id}">${countries.length}</span>
        </h2>
        <div class="continent-content">
            <table>
                <thead>
                    <tr>
                        <th class="col-num">№</th>
                        <th class="col-flag">Флаг</th>
                        <th>Страна</th>
                        <th>Столица</th>
                    </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
            </table>
        </div>
    `;
    tablesContainer.appendChild(block);
}

    document.getElementById('dbControls').style.display = 'none';
    
    /* 🌟 НАША БЕЗОПАСНАЯ СИНХРОННАЯ ЗАЩИТА: */
    /* При каждом нажатии на меню сбрасываем очки и возвращаем раунды на 1 */
    flagScore = 0; flagRound = 1;
    capScore = 0; capRound = 1;
    countryScore = 0; countryRound = 1;
    
    if (viewId === 'db') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('dbView').classList.add('active');
        document.getElementById('dbControls').style.display = 'flex';
    } else if (viewId === 'quiz-flags') {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('quizFlagsView').classList.add('active');

function toggleBlock(id) {
    const block = document.getElementById(id);
    block.classList.toggle('collapsed');
    
    const content = block.querySelector('.continent-content');
    if (content) {
        if (block.classList.contains('collapsed')) {
            content.style.display = 'none';
        } else {
            content.style.display = 'block';
        }

    const hasExpanded = document.querySelector('.continent-block:not(.collapsed)');
    allCollapsed = hasExpanded ? false : true; /* Работаем скрыто в памяти, не трогая элементы DOM */

         /* НАШ ТОЧНЫЙ АВТОСКРОЛЛ С ЗАЩИТОЙ: Теперь он железно внутри if (content) */
        if (content && content.style.display === 'block') {
            setTimeout(() => {
                const header = block.querySelector('.continent-header');
                const offset = 120; // Высота фиксированного меню в пикселях
                
                const elementPosition = header.getBoundingClientRect().top + window.scrollY;
                const offsetPosition = elementPosition - offset;

                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });
            }, 120); 
        }
    } // ЭТА СКОБКА ТЕПЕРЬ ПРАВИЛЬНО ЗАКРЫВАЕТ БЛОК if (content)
} // ЭТА СКОБКА ОКОНЧАТЕЛЬНО ЗАКРЫВАЕТ ФУНКЦИЮ toggleBlock

let allCollapsed = true; // Сделали true на старте, так как всё свернуто
        
function toggleAllContinents() {
    allCollapsed = !allCollapsed;
    
    document.querySelectorAll('.continent-block').forEach(b => {
        const content = b.querySelector('.continent-content');
        if (allCollapsed) {
            b.classList.add('collapsed');
            if (content) content.style.display = 'none';
        } else {
            b.classList.remove('collapsed');
            if (content) content.style.display = 'block';
        }
    });
    
    document.getElementById('toggleAllBtn').textContent = allCollapsed ? "Развернуть всё" : "Свернуть всё";

      if (allCollapsed) {
          setTimeout(() => {
              window.scrollTo({
                  top: 0,
                  behavior: 'smooth' /* Плавная и мягкая прокрутка наверх */
            });
        }, 50); // Микро-задержка, чтобы браузер успел скрыть таблицы до начала движения
    }
}


function runSearch() {
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearSearchBtn');
    const q = searchInput.value.toLowerCase().trim();
    
    if (searchInput.value.length > 0) {
        clearBtn.style.display = 'block';
    } else {
        clearBtn.style.display = 'none';
    }

    document.querySelectorAll('.continent-block').forEach(block => {
        const rows = block.querySelectorAll('tbody tr');
        const content = block.querySelector('.continent-content'); // Нашли скрытый контент таблицы
        let visibleCount = 0;
        
        rows.forEach(r => {
            const name = r.getAttribute('data-name');
            const cap = r.getAttribute('data-capital');
            if (name.includes(q) || cap.includes(q)) {
                r.classList.remove('hidden');
                visibleCount++;
            } else {
                r.classList.add('hidden');
            }
        });
        
        const badge = document.getElementById(`badge-${block.id}`);
        badge.textContent = visibleCount;
        
        if (visibleCount === 0 && q !== '') {
            block.style.display = 'none';
        } else {
            block.style.display = 'block';
            
            /* 🌟 НАШЕ ЖЕЛЕЗНОЕ ИСПРАВЛЕНИЕ: */
            if (q !== '') {
                // Если пользователь что-то ищет, принудительно РАСПАХИВАЕМ блок и контент на экране
                block.classList.remove('collapsed');
                if (content) content.style.display = 'block';
            } else {
                // Если поиск пустой, возвращаем базу в исходное свернутое состояние
                block.classList.add('collapsed');
                if (content) content.style.display = 'none';
            }
        }
    });
}


function clearSearch() {
    const searchInput = document.getElementById('searchInput');
    searchInput.value = '';
    runSearch();
    searchInput.focus();
}

document.getElementById('searchInput').addEventListener('input', runSearch);

window.addEventListener('scroll', () => {
    const btn = document.getElementById('scrollTopBtn');
    if (window.scrollY > 300) btn.style.display = 'flex';
    else btn.style.display = 'none';
});

function shuffle(arr) {
    return arr.sort(() => Math.random() - 0.5);
}

let flagScore = 0, flagRound = 1, currentFlagTarget;
function loadQuizFlagRound() {
    /* 🌟 ОБНУЛЯЕМ СЧЁТ СТРОГО ПРИ НАЖАТИИ «НАЧАТЬ ЗАНОВО» */
    if (flagRound === 1) {
        flagScore = 0;
    }
    
    document.getElementById('nextFlagBtn').style.display = 'none';
    currentFlagTarget = allCountriesList[Math.floor(Math.random() * allCountriesList.length)];
    
    let highResUrl = getFlagUrl(currentFlagTarget);
    const flagImgEl = document.getElementById('quizFlagImg');
    const flagContainerEl = document.querySelector('.quiz-flag-container');
    
    /* 🌟 НАША ИСПРАВЛЕННАЯ СВЕРХТОЧНАЯ ЗАЩИТА НЕПАЛА: */
    if (currentFlagTarget.iso.toLowerCase() === 'np') {
        flagContainerEl.style.backgroundColor = 'transparent';
        flagImgEl.className = 'quiz-flag-img'; /* МАСШТАБ ВОЗВРАЩАЕМ: Теперь он не взорвет экран! */
        flagImgEl.style.mixBlendMode = 'multiply'; /* Стирает белую коробку Википедии */
        
        /* ЮВЕЛИРНО УДАЛЯЕМ ЖЕСТКИЕ СЕРЫЕ КОНТУРЫ И ТЕНИ: */
        flagImgEl.style.border = 'none';
        flagImgEl.style.borderWidth = '0px';
        flagImgEl.style.boxShadow = 'none';
    } else {
        flagContainerEl.style.backgroundColor = '#ffffff';
        flagImgEl.className = 'quiz-flag-img';
        flagImgEl.style.mixBlendMode = 'normal';
        
        /* СБРАСЫВАЕМ СТИЛИ В ДЕФОЛТ ДЛЯ ОСТАЛЬНЫХ СТРАН МИРА (ЯПОНИЯ, ВАТИКАН): */
        flagImgEl.style.border = '';
        flagImgEl.style.borderWidth = '';
        flagImgEl.style.boxShadow = '';
    }
    
    flagImgEl.src = highResUrl;




    
    let choices = [currentFlagTarget];
    while(choices.length < 4) {
        let rand = allCountriesList[Math.floor(Math.random() * allCountriesList.length)];
        if(!choices.some(c => c.name === rand.name)) choices.push(rand);
    }
    shuffle(choices);
    
    const container = document.getElementById('quizFlagOptions');
    container.innerHTML = '';
    choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `${c.name} <span style="font-weight:normal; font-size:13px; opacity:0.85;">(${c.capital})</span>`;
        btn.onclick = () => checkFlagAnswer(btn, c.name);
        container.appendChild(btn);
    });
    const bestFlag = localStorage.getItem('highScore_flags') || 0;
    document.getElementById('quizFlagStats').innerHTML = `🏆 Рекорд: ${bestFlag} &nbsp;|&nbsp; 🎯 Очки: ${flagScore} &nbsp;|&nbsp; 📋 Раунд: ${flagRound}`;
}
function checkFlagAnswer(selectedBtn, chosenName) {
    document.querySelectorAll('#quizFlagOptions .option-btn').forEach(b => b.disabled = true);
    
    let isCorrect = (chosenName === currentFlagTarget.name);
    
    if (isCorrect) {
        selectedBtn.classList.add('correct');
        flagScore++;
        // ЛИШНЕЕ УДВОЕНИЕ flagRound++ ОТСЮДА УБРАНО!
    } else {
        selectedBtn.classList.add('wrong');
        document.querySelectorAll('#quizFlagOptions .option-btn').forEach(b => {
            if(b.innerHTML.startsWith(currentFlagTarget.name)) b.classList.add('correct');
        });
    }
    
    // Проверяем и обновляем High Score в памяти телефона на лету
    let bestFlag = localStorage.getItem('highScore_flags') || 0;
    if (flagScore > parseInt(bestFlag)) {
        localStorage.setItem('highScore_flags', flagScore);
        bestFlag = flagScore;
    }
    
    // Выводим статистику: Очки и Раунд остаются ТЕКУЩИМИ (не обнуляются раньше времени!)
    document.getElementById('quizFlagStats').innerHTML = `🏆 Рекорд: ${bestFlag} &nbsp;|&nbsp; 🎯 Очки: ${flagScore} &nbsp;|&nbsp; 📋 Раунд: ${flagRound}`;

    // Переименовываем кнопку и взводим триггер сброса на единицу для следующего раунда
    const nextBtn = document.getElementById('nextFlagBtn');
    if (!isCorrect) {
        nextBtn.textContent = 'Начать заново';
        flagRound = 1; // В памяти ставим 1. При клике на кнопку сработает сброс очков
    } else {
        nextBtn.textContent = 'Следующий флаг';
        flagRound++; // При успехе раунд мягко увеличивается строго на +1
    }
    
    nextBtn.style.display = 'inline-block';
}

        selectedBtn.classList.add('correct');
        capScore++;
    } else {

    if (capScore > parseInt(bestCap)) {

        capRound = 1; // Готовим сброс в 1 на следующий раунд
    } else {
        nextBtn.textContent = 'Следующий вопрос';
        capRound++;
    }
    nextBtn.style.display = 'inline-block';
}

function openFlagModal(imgSrc) {
    const modal = document.getElementById('flagModal');
    const modalImg = document.getElementById('flagModalImg');
    modalImg.src = imgSrc;
    
    /* 🌟 ТОЧЕЧНОЕ РАСТВОРЕНИЕ БЕЛЫХ ПОЛЕЙ НЕПАЛА */
    if (imgSrc.includes('NP.svg') || imgSrc.includes('np.svg')) {
        modalImg.style.setProperty('mix-blend-mode', 'multiply', 'important');
    } else {
        modalImg.style.setProperty('mix-blend-mode', 'normal', 'important');
    }
    
    // Страхуемся в памяти и принудительно обнуляем все параметры подложек при каждом клике
    modalImg.style.setProperty('background-color', 'transparent', 'important');
    modalImg.style.setProperty('border', 'none', 'important');
    modalImg.style.setProperty('box-shadow', 'none', 'important');
    modalImg.style.setProperty('clip-path', 'none', 'important');
    
    // Замораживаем страницу от любых боковых сдвигов жестами в Safari
    document.body.style.overflow = 'hidden';
    
    modal.style.display = 'flex';
    setTimeout(() => modal.classList.add('open'), 10);
}



function closeFlagModal() {
    const modal = document.getElementById('flagModal');
    modal.classList.remove('open');
    
    // Возвращаем мягкое листание обратно после закрытия окна
    document.body.style.overflow = '';
    
    setTimeout(() => modal.style.display = 'none', 200);
}
